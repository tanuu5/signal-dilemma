<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Audio (dev)</title>
<style>
  body { margin: 0; padding: 16px; font: 14px/1.5 system-ui, sans-serif; background: #f4f1ec; color: #222; }
  h2 { margin: 1em 0 0.4em; font-size: 15px; }
  .row { display: flex; flex-wrap: wrap; gap: 6px; }
  button { font: inherit; padding: 6px 12px; border-radius: 8px; border: 1px solid #0002; background: #fff; cursor: pointer; }
  button:hover { background: #ffe2cf; }
  table { border-collapse: collapse; margin-top: 8px; }
  td, th { padding: 2px 10px; border-bottom: 1px solid #0001; text-align: right; }
  td:first-child, th:first-child { text-align: left; }
  .bad { color: #c22; font-weight: 700; }
</style>
</head>
<body>
<p>効果音と曲を試す開発用のページ。最初にどこかをクリックすると音が出る。「書き出して確かめる」は OfflineAudioContext で全部を書き出し、ピーク・RMS・NaN を表にする（耳で聞けないときの確認）。</p>
<h2>効果音</h2><div class="row" id="sfx"></div>
<h2>曲</h2><div class="row" id="songs"></div>
<h2>確認</h2><div class="row"><button id="check">書き出して確かめる</button></div>
<table id="out"></table>
<script type="module" src="./audio.js"></script>
</body>
</html>
